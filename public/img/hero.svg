<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
<defs>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5BC43C" stop-opacity=".55"/><stop offset="1" stop-color="#5BC43C" stop-opacity="0"/></radialGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E4FB8"/><stop offset="1" stop-color="#0A1F4D"/></linearGradient>
<linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6FD14B"/><stop offset="1" stop-color="#3A9E24"/></linearGradient>
<linearGradient id="note" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6FD14B"/><stop offset="1" stop-color="#2E8A1C"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04112E" flood-opacity=".35"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#04112E" flood-opacity=".28"/></filter>
</defs>
<circle cx="290" cy="280" r="250" fill="url(#glow)"/>
<circle cx="290" cy="280" r="200" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
<circle cx="290" cy="280" r="250" fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="2"/>
<!-- banknotes behind phone -->
<g transform="rotate(-18 420 150)" filter="url(#sh2)"><rect x="350" y="110" width="150" height="80" rx="10" fill="url(#note)"/><circle cx="425" cy="150" r="22" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="425" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="800" font-size="26" fill="#FFFFFF">R</text></g>
<g transform="rotate(-6 440 175)"><rect x="372" y="138" width="150" height="80" rx="10" fill="#43B02A" opacity=".55"/></g>
<!-- phone -->
<g filter="url(#sh)">
<rect x="175" y="60" width="230" height="450" rx="38" fill="#071534"/>
<rect x="186" y="71" width="208" height="428" rx="30" fill="#F4F6FB"/>
<rect x="255" y="80" width="70" height="14" rx="7" fill="#071534"/>
</g>
<!-- screen content -->
<circle cx="212" cy="122" r="12" fill="#14327F"/><text x="212" y="127" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">M</text>
<text x="232" y="118" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#5B6880">Good morning</text>
<text x="232" y="131" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="12" fill="#0A1F4D">Thandi</text>
<rect x="198" y="148" width="184" height="118" rx="18" fill="url(#card)"/>
<circle cx="360" cy="160" r="40" fill="#FFFFFF" opacity=".07"/>
<text x="214" y="174" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#C9D4EA">Your offer</text>
