<text x="214" y="222" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#C9D4EA">over 3 months</text>
<rect x="214" y="236" width="152" height="7" rx="3.5" fill="#FFFFFF" opacity=".18"/><rect x="214" y="236" width="104" height="7" rx="3.5" fill="#6FD14B"/>
<text x="198" y="294" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="11" fill="#0A1F4D">Repayments</text>
<g font-family="Helvetica,Arial,sans-serif">
<rect x="198" y="304" width="184" height="40" rx="12" fill="#FFFFFF"/><circle cx="218" cy="324" r="10" fill="#E3F5DD"/><path d="M213 324l3.5 3.5 6-7" stroke="#1F7A1A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="236" y="321" font-size="10" font-weight="700" fill="#0A1F4D">25 Oct</text><text x="236" y="334" font-size="9" fill="#5B6880">Paid</text><text x="372" y="328" text-anchor="end" font-size="11" font-weight="800" fill="#0A1F4D">R1 340</text>
<rect x="198" y="350" width="184" height="40" rx="12" fill="#FFFFFF"/><circle cx="218" cy="370" r="10" fill="#FEF3C7"/><circle cx="218" cy="370" r="3" fill="#8A3C04"/><text x="236" y="367" font-size="10" font-weight="700" fill="#0A1F4D">25 Nov</text><text x="236" y="380" font-size="9" fill="#5B6880">Due soon</text><text x="372" y="374" text-anchor="end" font-size="11" font-weight="800" fill="#0A1F4D">R1 340</text>
<rect x="198" y="396" width="184" height="40" rx="12" fill="#FFFFFF"/><circle cx="218" cy="416" r="10" fill="#EEF1F6"/><text x="236" y="413" font-size="10" font-weight="700" fill="#0A1F4D">25 Dec</text><text x="236" y="426" font-size="9" fill="#5B6880">Upcoming</text><text x="372" y="420" text-anchor="end" font-size="11" font-weight="800" fill="#0A1F4D">R1 340</text>
<rect x="198" y="448" width="184" height="36" rx="12" fill="url(#btn)"/><text x="290" y="471" text-anchor="middle" font-size="12" font-weight="800" fill="#0A1F4D">Make a payment</text>
</g>
<!-- floating approved card -->
<g filter="url(#sh2)" font-family="Helvetica,Arial,sans-serif">
<rect x="4" y="180" width="164" height="66" rx="16" fill="#FFFFFF"/>
<circle cx="36" cy="213" r="17" fill="url(#btn)"/><path d="M28 213l5.5 5.5 9-10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="207" font-size="11" fill="#5B6880">Approved</text><text x="62" y="226" font-size="15" font-weight="800" fill="#0A1F4D">R3 000 paid</text>
</g>
<!-- floating reminder -->
<g filter="url(#sh2)" font-family="Helvetica,Arial,sans-serif">
<rect x="392" y="300" width="164" height="64" rx="16" fill="#FFFFFF"/>
<rect x="404" y="314" width="36" height="36" rx="10" fill="#EAF0FB"/><path d="M414 330a8 8 0 0 1 16 0c0 7 3 8 3 8h-22s3-1 3-8M419 342h6" stroke="#14327F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="326" font-size="10" fill="#5B6880">Reminder</text><text x="450" y="344" font-size="13" font-weight="800" fill="#0A1F4D">Due in 3 days</text>
</g>
<!-- coins -->
<g filter="url(#sh2)">
<ellipse cx="110" cy="440" rx="40" ry="12" fill="#2E8A1C"/><rect x="70" y="428" width="80" height="12" fill="#2E8A1C"/><ellipse cx="110" cy="428" rx="40" ry="12" fill="#5BC43C"/>
<ellipse cx="110" cy="420" rx="40" ry="12" fill="#2E8A1C"/><rect x="70" y="408" width="80" height="12" fill="#2E8A1C"/><ellipse cx="110" cy="408" rx="40" ry="12" fill="#6FD14B"/>
<ellipse cx="110" cy="400" rx="40" ry="12" fill="#2E8A1C"/><rect x="70" y="388" width="80" height="12" fill="#2E8A1C"/><ellipse cx="110" cy="388" rx="40" ry="12" fill="#7FD35F"/>
<text x="110" y="393" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="800" font-size="14" fill="#1A6B16">R</text>
</g>
<g fill="#FFFFFF"><path d="M470 260l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity=".8"/><path d="M80 120l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity=".6"/><path d="M500 90l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity=".5"/></g>
</svg>
